<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c147e9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.2" />
    </linearGradient>

    <style>
      .title {
        font-family: 'Segoe UI', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #ffffff;
      }
      .card-name {
        font-family: 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #e6edf3;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="900" height="240" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(25, 22)">
    <circle cx="10" cy="10" r="6" fill="#00d2ff" />
    <text x="24" y="15" class="title">💼 Professional Services &amp; Technical Offerings</text>
    <line x1="0" y1="28" x2="850" y2="28" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- 8 Tile Cards (4 x 2 Grid) -->
  <g transform="translate(25, 68)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="28" font-family="sans-serif" font-size="16">🚀</text>
      <text x="42" y="28" class="card-name">Full Stack Apps</text>
      <text x="42" y="46" font-family="sans-serif" font-size="11" fill="#8b949e">React, Node, DB</text>
    </g>

    <g transform="translate(216, 0)">
      <rect width="200" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="28" font-family="sans-serif" font-size="16">🌐</text>
      <text x="42" y="28" class="card-name">Business Websites</text>
      <text x="42" y="46" font-family="sans-serif" font-size="11" fill="#8b949e">Fast, SEO Optimized</text>
    </g>

    <g transform="translate(432, 0)">
      <rect width="200" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="28" font-family="sans-serif" font-size="16">⚡</text>
      <text x="42" y="28" class="card-name">SaaS Platforms</text>
      <text x="42" y="46" font-family="sans-serif" font-size="11" fill="#8b949e">Multi-tenant, Auth</text>
    </g>

    <g transform="translate(648, 0)">
      <rect width="202" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="28" font-family="sans-serif" font-size="16">🔗</text>
      <text x="42" y="28" class="card-name">REST APIs</text>
      <text x="42" y="46" font-family="sans-serif" font-size="11" fill="#8b949e">Express, FastAPI</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 80)">
      <rect width="200" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="28" font-family="sans-serif" font-size="16">📊</text>
      <text x="42" y="28" class="card-name">Dashboards</text>
      <text x="42" y="46" font-family="sans-serif" font-size="11" fill="#8b949e">Analytics, Admin</text>
    </g>

    <g transform="translate(216, 80)">
      <rect width="200" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="28" font-family="sans-serif" font-size="16">🎨</text>
      <text x="42" y="28" class="card-name">UI Engineering</text>
      <text x="42" y="46" font-family="sans-serif" font-size="11" fill="#8b949e">Responsive, Clean</text>
    </g>

    <g transform="translate(432, 80)">
      <rect width="200" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="28" font-family="sans-serif" font-size="16">🤖</text>
      <text x="42" y="28" class="card-name">AI Integration</text>
      <text x="42" y="46" font-family="sans-serif" font-size="11" fill="#8b949e">LLMs &amp; Workflows</text>
    </g>

    <g transform="translate(648, 80)">
      <rect width="202" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="14" y="28" font-family="sans-serif" font-size="16">☁️</text>
      <text x="42" y="28" class="card-name">Deployment Setup</text>
      <text x="42" y="46" font-family="sans-serif" font-size="11" fill="#8b949e">Vercel, Docker, CI</text>
    </g>
  </g>
</svg>
