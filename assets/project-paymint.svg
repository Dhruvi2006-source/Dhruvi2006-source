<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c147e9" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c147e9" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>

    <style>
      .proj-title {
        font-family: 'Segoe UI', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #ffffff;
      }
      .proj-desc {
        font-family: 'Segoe UI', sans-serif;
        font-size: 13.5px;
        fill: #c9d1d9;
        line-height: 1.5;
      }
      .feature-item {
        font-family: 'Segoe UI', sans-serif;
        font-size: 12.5px;
        fill: #8b949e;
      }
      .btn-text {
        font-family: 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Outer Glass Frame -->
  <rect width="850" height="360" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Left Side: UI Mockup Preview Graphic (x:20, y:20, w:380, h:320) -->
  <g transform="translate(20, 20)">
    <rect width="380" height="320" rx="10" fill="#090d13" stroke="#30363d" stroke-width="1" />
    
    <!-- Top Browser Header Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 370 0 Q 380 0 380 10 L 380 32 L 0 32 Z" fill="#161b22" />
    <circle cx="14" cy="16" r="4" fill="#ff5f56" />
    <circle cx="26" cy="16" r="4" fill="#ffbd2e" />
    <circle cx="38" cy="16" r="4" fill="#27c93f" />
    <rect x="60" y="7" width="220" height="18" rx="4" fill="#0d1117" />
    <text x="70" y="20" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8b949e">paymint.app/invoices/inv-0924</text>

    <!-- Mock Invoice Preview Document -->
    <g transform="translate(30, 48)">
      <rect width="320" height="250" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      
      <!-- Invoice Header -->
      <text x="20" y="30" font-family="sans-serif" font-weight="800" font-size="16" fill="#c147e9">PAYMINT</text>
      <text x="240" y="24" font-family="sans-serif" font-weight="700" font-size="10" fill="#8b949e">INVOICE</text>
      <text x="240" y="38" font-family="monospace" font-size="10" fill="#00d2ff">#INV-2026-09</text>

      <!-- Client & Amount Box -->
      <rect x="20" y="52" width="280" height="50" rx="6" fill="#0d1117" />
      <text x="32" y="70" font-family="sans-serif" font-size="10" fill="#8b949e">BILLED TO</text>
      <text x="32" y="88" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">Acme Tech Corp</text>
      
      <text x="200" y="70" font-family="sans-serif" font-size="10" fill="#8b949e">AMOUNT DUE</text>
      <text x="200" y="90" font-family="'Fira Code', monospace" font-weight="800" font-size="15" fill="#00ff88">$2,450.00</text>

      <!-- Itemized Table Mockup -->
      <g transform="translate(20, 115)">
        <rect width="280" height="20" rx="4" fill="#21262d" />
        <text x="10" y="14" font-family="sans-serif" font-size="9" fill="#8b949e">ITEM DESCRIPTION</text>
        <text x="220" y="14" font-family="sans-serif" font-size="9" fill="#8b949e">PRICE</text>

        <!-- Line 1 -->
        <rect x="10" y="30" width="140" height="6" rx="3" fill="#8b949e" />
        <rect x="220" y="30" width="40" height="6" rx="3" fill="#c9d1d9" />

        <!-- Line 2 -->
        <rect x="10" y="44" width="110" height="6" rx="3" fill="#8b949e" />
        <rect x="220" y="44" width="40" height="6" rx="3" fill="#c9d1d9" />

        <!-- Status Tag & Export PDF Button -->
        <rect x="0" y="75" width="80" height="22" rx="11" fill="rgba(0, 255, 136, 0.15)" stroke="#00ff88" stroke-width="1" />
        <text x="14" y="90" font-family="sans-serif" font-weight="600" font-size="10" fill="#00ff88">PAID</text>

        <rect x="180" y="75" width="100" height="22" rx="6" fill="#c147e9" />
        <text x="194" y="90" font-family="sans-serif" font-weight="700" font-size="10" fill="#ffffff">📄 Export PDF</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Project Details & Tech Stack (x:420, y:25) -->
  <g transform="translate(420, 25)">
    <text x="0" y="20" class="proj-title">Invoice Generator (Paymint)</text>
    <text x="0" y="42" class="proj-desc">A streamlined financial billing &amp; invoicing tool engineered for freelancers and agencies to automate client payment tracking and PDF generation.</text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="60" height="22" rx="11" fill="#161b22" stroke="#c147e9" stroke-width="1" />
      <text x="13" y="15" font-family="sans-serif" font-weight="600" font-size="11" fill="#c147e9">React</text>

      <rect x="68" y="0" width="70" height="22" rx="11" fill="#161b22" stroke="#8a2be2" stroke-width="1" />
      <text x="80" y="15" font-family="sans-serif" font-weight="600" font-size="11" fill="#8a2be2">Node.js</text>

      <rect x="146" y="0" width="75" height="22" rx="11" fill="#161b22" stroke="#00ff88" stroke-width="1" />
      <text x="158" y="15" font-family="sans-serif" font-weight="600" font-size="11" fill="#00ff88">MongoDB</text>
    </g>

    <!-- Key Features List -->
    <g transform="translate(0, 132)">
      <text x="0" y="16" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">KEY FEATURES</text>
      <line x1="0" y1="24" x2="390" y2="24" stroke="#30363d" stroke-width="1" />

      <text x="0" y="44" class="feature-item">⚡ Instant client invoice generation with customizable line items</text>
      <text x="0" y="64" class="feature-item">⚡ High-resolution PDF export engine for instant client downloads</text>
      <text x="0" y="84" class="feature-item">⚡ Payment status tracking (Draft, Sent, Paid, Overdue)</text>
      <text x="0" y="104" class="feature-item">⚡ Billing analytics dashboard with monthly revenue metrics</text>
    </g>

    <!-- CTA Button Graphics -->
    <g transform="translate(0, 272)">
      <rect width="130" height="34" rx="8" fill="url(#btnGrad)" />
      <text x="26" y="21" class="btn-text">📦 View Code</text>

      <rect x="142" y="0" width="130" height="34" rx="8" fill="#161b22" stroke="#c147e9" stroke-width="1" />
      <text x="168" y="21" class="btn-text" fill="#c147e9">🚀 Live Demo</text>
    </g>
  </g>
</svg>
