<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c147e9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(193, 71, 233, 0.15)" />
      <stop offset="100%" stop-color="rgba(138, 43, 226, 0.05)" />
    </linearGradient>

    <style>
      .section-title {
        font-family: 'Segoe UI', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #ffffff;
      }
      .tool-name {
        font-family: 'Fira Code', monospace;
        font-weight: 600;
        font-size: 13.5px;
        fill: #c147e9;
      }
      .tool-use {
        font-family: 'Segoe UI', sans-serif;
        font-size: 13px;
        fill: #c9d1d9;
      }
      .badge-tag {
        font-family: 'Segoe UI', sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #ffffff;
      }
      .footer-note {
        font-family: 'Segoe UI', sans-serif;
        font-style: italic;
        font-size: 12.5px;
        fill: #8b949e;
      }
    </style>
  </defs>

  <rect width="900" height="360" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(25, 22)">
    <circle cx="10" cy="10" r="6" fill="#8a2be2" />
    <text x="24" y="15" class="section-title">⚡ AI Developer Toolkit &amp; Workflow Integration</text>
    <line x1="0" y1="28" x2="850" y2="28" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- Tools Grid / List -->
  <g transform="translate(25, 68)">
    <!-- Row Header -->
    <rect width="850" height="30" rx="6" fill="url(#headerGrad)" />
    <text x="20" y="20" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#8b949e">TOOL / PLATFORM</text>
    <text x="260" y="20" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#8b949e">INTEGRATION &amp; WORKFLOW USE CASE</text>
    <text x="730" y="20" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#8b949e">STATUS</text>

    <!-- Row 1: GitHub Copilot -->
    <g transform="translate(0, 36)">
      <rect width="850" height="34" rx="6" fill="#161b22" opacity="0.6" />
      <text x="20" y="22" class="tool-name">GitHub Copilot</text>
      <text x="260" y="22" class="tool-use">In-editor real-time code suggestions, autocompletion &amp; boilerplate</text>
      <rect x="730" y="7" width="80" height="20" rx="10" fill="#238636" />
      <text x="746" y="21" class="badge-tag">Daily Core</text>
    </g>

    <!-- Row 2: Claude Code -->
    <g transform="translate(0, 74)">
      <rect width="850" height="34" rx="6" fill="#0d1117" />
      <text x="20" y="22" class="tool-name">Claude Code</text>
      <text x="260" y="22" class="tool-use">Architectural planning, complex debugging &amp; codebase refactoring</text>
      <rect x="730" y="7" width="80" height="20" rx="10" fill="#238636" />
      <text x="746" y="21" class="badge-tag">Daily Core</text>
    </g>

    <!-- Row 3: ChatGPT -->
    <g transform="translate(0, 112)">
      <rect width="850" height="34" rx="6" fill="#161b22" opacity="0.6" />
      <text x="20" y="22" class="tool-name">ChatGPT</text>
      <text x="260" y="22" class="tool-use">Deep research, documentation generation &amp; problem breakdown</text>
      <rect x="730" y="7" width="80" height="20" rx="10" fill="#238636" />
      <text x="746" y="21" class="badge-tag">Daily Core</text>
    </g>

    <!-- Row 4: Cursor -->
    <g transform="translate(0, 150)">
      <rect width="850" height="34" rx="6" fill="#0d1117" />
      <text x="20" y="22" class="tool-name">Cursor</text>
      <text x="260" y="22" class="tool-use">AI-native code editor for multi-file workspace edits &amp; indexing</text>
      <rect x="730" y="7" width="80" height="20" rx="10" fill="#8957e5" />
      <text x="744" y="21" class="badge-tag">Primary IDE</text>
    </g>

    <!-- Row 5: Google AI Studio & Gemini -->
    <g transform="translate(0, 188)">
      <rect width="850" height="34" rx="6" fill="#161b22" opacity="0.6" />
      <text x="20" y="22" class="tool-name">Google AI Studio &amp; Gemini</text>
      <text x="260" y="22" class="tool-use">Prototyping AI features, prompt tuning &amp; research context expansion</text>
      <rect x="730" y="7" width="80" height="20" rx="10" fill="#1f6beb" />
      <text x="743" y="21" class="badge-tag">Exploring</text>
    </g>

    <!-- Row 6: Gemini CLI -->
    <g transform="translate(0, 226)">
      <rect width="850" height="34" rx="6" fill="#0d1117" />
      <text x="20" y="22" class="tool-name">Gemini CLI</text>
      <text x="260" y="22" class="tool-use">Terminal-driven AI workflow automation &amp; shell script assistance</text>
      <rect x="730" y="7" width="80" height="20" rx="10" fill="#1f6beb" />
      <text x="743" y="21" class="badge-tag">Exploring</text>
    </g>

    <!-- Footer Note inside SVG -->
    <g transform="translate(0, 266)">
      <line x1="0" y1="0" x2="850" y2="0" stroke="#30363d" stroke-width="1" />
      <text x="10" y="16" class="footer-note">💡 "These tools accelerate my development cycle while every architectural decision remains 100% human-guided."</text>
    </g>
  </g>
</svg>
