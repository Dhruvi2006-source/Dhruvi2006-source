<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c147e9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.2" />
    </linearGradient>

    <style>
      .title {
        font-family: 'Segoe UI', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #ffffff;
      }
      .item-text {
        font-family: 'Segoe UI', sans-serif;
        font-size: 13px;
        fill: #c9d1d9;
      }
      .goal-check {
        font-family: 'Fira Code', monospace;
        font-weight: 700;
        font-size: 14px;
        fill: #c147e9;
      }
    </style>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Left Panel: 2026 Goals (w:415) -->
  <g transform="translate(25, 22)">
    <text x="0" y="16" class="title">🎯 2026 Developer Goals</text>
    <line x1="0" y1="26" x2="415" y2="26" stroke="#30363d" stroke-width="1" />

    <g transform="translate(0, 48)">
      <!-- Goal 1 -->
      <g transform="translate(0, 0)">
        <rect width="20" height="20" rx="4" fill="#161b22" stroke="#c147e9" stroke-width="1.5" />
        <text x="5" y="15" class="goal-check">✓</text>
        <text x="30" y="15" class="item-text">Master Data Structures &amp; Algorithms</text>
      </g>

      <!-- Goal 2 -->
      <g transform="translate(0, 32)">
        <rect width="20" height="20" rx="4" fill="#161b22" stroke="#c147e9" stroke-width="1.5" />
        <text x="5" y="15" class="goal-check">✓</text>
        <text x="30" y="15" class="item-text">Ship cross-platform React Native apps</text>
      </g>

      <!-- Goal 3 -->
      <g transform="translate(0, 64)">
        <rect width="20" height="20" rx="4" fill="#161b22" stroke="#c147e9" stroke-width="1.5" />
        <text x="5" y="15" class="goal-check">✓</text>
        <text x="30" y="15" class="item-text">Build &amp; deploy AI-powered web products</text>
      </g>

      <!-- Goal 4 -->
      <g transform="translate(0, 96)">
        <rect width="20" height="20" rx="4" fill="#161b22" stroke="#c147e9" stroke-width="1.5" />
        <text x="5" y="15" class="goal-check">✓</text>
        <text x="30" y="15" class="item-text">Consistent high-impact Open Source PRs</text>
      </g>

      <!-- Goal 5 -->
      <g transform="translate(0, 128)">
        <rect width="20" height="20" rx="4" fill="#161b22" stroke="#c147e9" stroke-width="1.5" />
        <text x="5" y="15" class="goal-check">✓</text>
        <text x="30" y="15" class="item-text">Deepen System Design for scale</text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="465" y1="20" x2="465" y2="240" stroke="#30363d" stroke-width="1" />

  <!-- Right Panel: Achievements (x:485, w:390) -->
  <g transform="translate(485, 22)">
    <text x="0" y="16" class="title">🏆 Achievements &amp; Milestones</text>
    <line x1="0" y1="26" x2="390" y2="26" stroke="#30363d" stroke-width="1" />

    <g transform="translate(0, 48)">
      <!-- Ach 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="15" font-family="sans-serif" font-size="14">🥇</text>
        <text x="24" y="15" class="item-text">ECSoC'26 Contributor (Score: 1340, Rank #46)</text>
      </g>

      <!-- Ach 2 -->
      <g transform="translate(0, 32)">
        <text x="0" y="15" font-family="sans-serif" font-size="14">🎖️</text>
        <text x="24" y="15" class="item-text">Earned Mission Accepted, Rookie &amp; Hustler badges</text>
      </g>

      <!-- Ach 3 -->
      <g transform="translate(0, 64)">
        <text x="0" y="15" font-family="sans-serif" font-size="14">⚡</text>
        <text x="24" y="15" class="item-text">Architected &amp; deployed full stack web apps</text>
      </g>

      <!-- Ach 4 -->
      <g transform="translate(0, 96)">
        <text x="0" y="15" font-family="sans-serif" font-size="14">🤖</text>
        <text x="24" y="15" class="item-text">Integrated AI workflows with Cursor &amp; Claude Code</text>
      </g>

      <!-- Ach 5 -->
      <g transform="translate(0, 128)">
        <text x="0" y="15" font-family="sans-serif" font-size="14">🌱</text>
        <text x="24" y="15" class="item-text">Continuous learner across Web, Mobile &amp; Systems</text>
      </g>
    </g>
  </g>
</svg>
