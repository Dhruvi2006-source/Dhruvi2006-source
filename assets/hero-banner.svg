<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#0d0e15" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c147e9" />
      <stop offset="50%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#4a00e0" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c147e9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8a2be2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9b30ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #ffffff;
      }
      .gradient-text {
        fill: url(#neonGlow);
      }
      .subtitle {
        font-family: 'Fira Code', Consolas, monospace;
        font-weight: 500;
        font-size: 16px;
        fill: #c147e9;
      }
      .desc {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 14px;
        fill: #8b949e;
      }
      .badge-text {
        font-family: 'Segoe UI', sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #ffffff;
      }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseBeam {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }
      .animated-float {
        animation: float 4s ease-in-out infinite;
      }
      .pulse-bg {
        animation: pulseBeam 3s infinite;
      }
    </style>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Tech Lines Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" />
    <line x1="450" y1="0" x2="450" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
    <line x1="750" y1="0" x2="750" y2="240" />
  </g>

  <!-- Top Ambient Glow Orbs -->
  <circle cx="150" cy="40" r="100" fill="#8a2be2" opacity="0.25" filter="url(#glow)" class="pulse-bg" />
  <circle cx="750" cy="180" r="110" fill="#c147e9" opacity="0.2" filter="url(#glow)" class="pulse-bg" />

  <!-- Main Glass Panel -->
  <rect x="20" y="20" width="860" height="200" rx="14" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Decorative HUD Corner Accents -->
  <path d="M 30 35 L 30 28 L 37 28" fill="none" stroke="#c147e9" stroke-width="2" />
  <path d="M 870 35 L 870 28 L 863 28" fill="none" stroke="#c147e9" stroke-width="2" />
  <path d="M 30 205 L 30 212 L 37 212" fill="none" stroke="#c147e9" stroke-width="2" />
  <path d="M 870 205 L 870 212 L 863 212" fill="none" stroke="#c147e9" stroke-width="2" />

  <!-- Avatar / Icon Ring Graphic -->
  <g transform="translate(60, 45)" class="animated-float">
    <circle cx="55" cy="55" r="52" fill="#161b22" stroke="url(#neonGlow)" stroke-width="3" filter="url(#subtleGlow)" />
    <circle cx="55" cy="55" r="44" fill="#0d1117" />
    <!-- Code / Terminal Avatar Emblem -->
    <path d="M 42 42 L 30 55 L 42 68" fill="none" stroke="#c147e9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 68 42 L 80 55 L 68 68" fill="none" stroke="#8a2be2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="58" y1="40" x2="52" y2="70" stroke="#9b30ff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Profile Text Info -->
  <g transform="translate(195, 62)">
    <!-- Main Title -->
    <text x="0" y="28" class="title">Hi, I'm <tspan class="gradient-text">Dhruvi Patel</tspan></text>
    
    <!-- Animated Subtitle -->
    <text x="0" y="58" class="subtitle">&gt; Full Stack Developer | AI-Assisted Builder</text>

    <!-- Bio Description -->
    <text x="0" y="82" class="desc">Building scalable web applications, clean architectures &amp; intelligent developer workflows.</text>

    <!-- Status Badges Row -->
    <g transform="translate(0, 98)">
      <!-- Badge 1: Open for Collaborations -->
      <rect x="0" y="0" width="165" height="26" rx="13" fill="#161b22" stroke="#c147e9" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#00ff88" filter="url(#subtleGlow)" />
      <text x="26" y="17" class="badge-text">Available for Work</text>

      <!-- Badge 2: Open Source Contributor -->
      <rect x="175" y="0" width="160" height="26" rx="13" fill="#161b22" stroke="#8a2be2" stroke-width="1" />
      <circle cx="189" cy="13" r="4" fill="#c147e9" filter="url(#subtleGlow)" />
      <text x="201" y="17" class="badge-text">ECSoC'26 Contributor</text>

      <!-- Badge 3: Location / Goal -->
      <rect x="345" y="0" width="145" height="26" rx="13" fill="#161b22" stroke="#9b30ff" stroke-width="1" />
      <circle cx="359" cy="13" r="4" fill="#00d2ff" filter="url(#subtleGlow)" />
      <text x="371" y="17" class="badge-text">Web &amp; Mobile AI</text>
    </g>
  </g>
</svg>
