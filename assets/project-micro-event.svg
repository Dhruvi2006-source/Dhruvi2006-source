<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c147e9" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8a2be2" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c147e9" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>

    <style>
      .proj-title {
        font-family: 'Segoe UI', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 20px;
        fill: #ffffff;
      }
      .proj-desc {
        font-family: 'Segoe UI', sans-serif;
        font-size: 13.5px;
        fill: #c9d1d9;
        line-height: 1.5;
      }
      .feature-item {
        font-family: 'Segoe UI', sans-serif;
        font-size: 12.5px;
        fill: #8b949e;
      }
      .btn-text {
        font-family: 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Outer Glass Frame -->
  <rect width="850" height="360" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Left Side: UI Mockup Preview Graphic (x:20, y:20, w:380, h:320) -->
  <g transform="translate(20, 20)">
    <rect width="380" height="320" rx="10" fill="#090d13" stroke="#30363d" stroke-width="1" />
    
    <!-- Top Browser Header Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 370 0 Q 380 0 380 10 L 380 32 L 0 32 Z" fill="#161b22" />
    <circle cx="14" cy="16" r="4" fill="#ff5f56" />
    <circle cx="26" cy="16" r="4" fill="#ffbd2e" />
    <circle cx="38" cy="16" r="4" fill="#27c93f" />
    <rect x="60" y="7" width="220" height="18" rx="4" fill="#0d1117" />
    <text x="70" y="20" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8b949e">micro-events.app/explore</text>

    <!-- Mock Events Discovery Feed Layout -->
    <g transform="translate(15, 45)">
      <!-- Search Bar -->
      <rect width="350" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="16" y="18" font-family="sans-serif" font-size="11" fill="#8b949e">🔍 Search tech meetups, hackathons &amp; workshops...</text>

      <!-- Event Card 1 -->
      <g transform="translate(0, 40)">
        <rect width="168" height="210" rx="8" fill="#161b22" stroke="#c147e9" stroke-width="1" />
        <rect width="168" height="90" rx="8" fill="#21262d" />
        <circle cx="84" cy="45" r="22" fill="#c147e9" opacity="0.3" />
        <text x="64" y="50" font-family="sans-serif" font-size="16">🚀</text>

        <text x="12" y="112" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">AI &amp; Web Dev Summit</text>
        <text x="12" y="128" font-family="sans-serif" font-size="9.5" fill="#00d2ff">📍 Downtown Tech Hub</text>
        <text x="12" y="142" font-family="sans-serif" font-size="9.5" fill="#8b949e">📅 Aug 24 · 6:00 PM</text>

        <rect x="12" y="165" width="144" height="24" rx="12" fill="#c147e9" />
        <text x="56" y="181" font-family="sans-serif" font-weight="700" font-size="10" fill="#ffffff">RSVP Now</text>
      </g>

      <!-- Event Card 2 -->
      <g transform="translate(182, 40)">
        <rect width="168" height="210" rx="8" fill="#161b22" stroke="#8a2be2" stroke-width="1" />
        <rect width="168" height="90" rx="8" fill="#21262d" />
        <circle cx="84" cy="45" r="22" fill="#8a2be2" opacity="0.3" />
        <text x="64" y="50" font-family="sans-serif" font-size="16">⚡</text>

        <text x="12" y="112" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">Open Source Jam</text>
        <text x="12" y="128" font-family="sans-serif" font-size="9.5" fill="#00ff88">📍 Virtual Stream</text>
        <text x="12" y="142" font-family="sans-serif" font-size="9.5" fill="#8b949e">📅 Aug 28 · 8:00 PM</text>

        <rect x="12" y="165" width="144" height="24" rx="12" fill="#161b22" stroke="#8a2be2" stroke-width="1" />
        <text x="50" y="181" font-family="sans-serif" font-weight="700" font-size="10" fill="#8a2be2">View Details</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Project Details & Tech Stack (x:420, y:25) -->
  <g transform="translate(420, 25)">
    <text x="0" y="20" class="proj-title">Micro Event Discovery</text>
    <text x="0" y="42" class="proj-desc">A real-time hyper-local event discovery platform allowing users to browse tech meetups, filter by location radius, and receive instant push updates.</text>

    <!-- Tech Stack Pill Row -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="60" height="22" rx="11" fill="#161b22" stroke="#c147e9" stroke-width="1" />
      <text x="13" y="15" font-family="sans-serif" font-weight="600" font-size="11" fill="#c147e9">React</text>

      <rect x="68" y="0" width="70" height="22" rx="11" fill="#161b22" stroke="#8a2be2" stroke-width="1" />
      <text x="80" y="15" font-family="sans-serif" font-weight="600" font-size="11" fill="#8a2be2">Node.js</text>

      <rect x="146" y="0" width="75" height="22" rx="11" fill="#161b22" stroke="#00ff88" stroke-width="1" />
      <text x="158" y="15" font-family="sans-serif" font-weight="600" font-size="11" fill="#00ff88">MongoDB</text>
    </g>

    <!-- Key Features List -->
    <g transform="translate(0, 132)">
      <text x="0" y="16" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">KEY FEATURES</text>
      <line x1="0" y1="24" x2="390" y2="24" stroke="#30363d" stroke-width="1" />

      <text x="0" y="44" class="feature-item">⚡ Location-based event browsing with dynamic map views</text>
      <text x="0" y="64" class="feature-item">⚡ Real-time attendee counter &amp; notification dispatch</text>
      <text x="0" y="84" class="feature-item">⚡ Category filtering (Tech, Workshops, Social, Hackathons)</text>
      <text x="0" y="104" class="feature-item">⚡ One-click calendar synchronization &amp; seat reservation</text>
    </g>

    <!-- CTA Button Graphics -->
    <g transform="translate(0, 272)">
      <rect width="130" height="34" rx="8" fill="url(#btnGrad)" />
      <text x="26" y="21" class="btn-text">📦 View Code</text>

      <rect x="142" y="0" width="130" height="34" rx="8" fill="#161b22" stroke="#c147e9" stroke-width="1" />
      <text x="168" y="21" class="btn-text" fill="#c147e9">🚀 Live Demo</text>
    </g>
  </g>
</svg>
