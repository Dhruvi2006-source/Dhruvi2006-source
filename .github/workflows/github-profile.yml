name: Update GitHub Profile Cards

on:
  schedule:
    # Update every 15 minutes
    - cron: "*/15 * * * *"

  # Allows you to manually run the workflow from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-cards
  cancel-in-progress: false

jobs:
  update-profile:
    name: Generate Profile Cards
    runs-on: ubuntu-latest

    steps:
      # Checkout your profile repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Make sure the output directory exists
      - name: Create profile directory
        run: mkdir -p profile

      # ==========================================
      # GitHub Stats
      # ==========================================
      - name: Generate GitHub Stats
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=Dhruvi2006-source&show_icons=true&theme=synthwave&hide_border=true&bg_color=00000000"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Top Languages
      # ==========================================
      - name: Generate Top Languages
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=Dhruvi2006-source&layout=compact&theme=synthwave&hide_border=true&bg_color=00000000"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # GitHub Activity Graph
      # ==========================================
      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Dhruvi2006-source
          options: "theme=react-dark&hide_border=true&bg_color=00000000&color=FF6A00&line=FF1E8E&point=00E0FF"
          output_path: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # GitHub Trophies
      # ==========================================
      - name: Generate GitHub Trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=Dhruvi2006-source&theme=radical&no-frame=true&column=4&margin-w=8&margin-h=8"
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # Commit only if something changed
      # ==========================================
      - name: Commit updated profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/activity.svg
          git add profile/trophy.svg

          if git diff --cached --quiet; then
            echo "No profile card changes detected."
          else
            git commit -m "chore: update GitHub profile cards"
            git push
          fi